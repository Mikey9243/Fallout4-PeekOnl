name: Windows plugin build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Check out CommonLibF4
        uses: actions/checkout@v6
        with:
          repository: libxse/commonlibf4
          path: lib/commonlibf4
          submodules: recursive

      - name: Set up XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure x64 Windows release
        run: xmake f -p windows -a x64 -m release -y

      - name: Build plugin
        run: xmake build -y

      - name: Assemble Vortex archive
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Filter PeekOnly.dll -File -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'PeekOnly.dll was not produced' }
          $pluginDir = Join-Path $PWD 'package/Data/F4SE/Plugins'
          New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination $pluginDir
          Copy-Item -LiteralPath 'Data/F4SE/Plugins/PeekOnly.ini' -Destination $pluginDir
          Copy-Item -LiteralPath 'README.md' -Destination 'package/README.md'

      - name: Upload Vortex archive
        uses: actions/upload-artifact@v4
        with:
          name: PeekOnly-Vortex
          path: package/*
          if-no-files-found: error

